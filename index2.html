<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563EB">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>シフト管理</title>
<style>
:root{
  --bg:#F4F6F9;--surface:#FFFFFF;--surface2:#EEF1F5;--border:#E2E6EC;--border2:#C9D1DC;
  --text:#121826;--text2:#4A5568;--text3:#8A94A6;
  --accent:#2563EB;--accent-l:#EAF1FE;--green:#047857;--green-l:#E7F6EF;
  --amber:#A15C07;--amber-l:#FDF4E3;--red:#C62828;--red-l:#FDECEC;--purple:#6D28D9;--purple-l:#F2EDFD;
  --bc-bg:#D6E4FD;--bc-tx:#1E3A8A;--bp-bg:#FCEFC7;--bp-tx:#713F12;--ba-bg:#E9E1FB;--ba-tx:#4C1D95;--be-bg:#FAD4D4;--be-tx:#7F1D1D;
  --cw:26px;--dw:468px;--lab:132px;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1117;--surface:#161A22;--surface2:#1E232D;--border:#2A303C;--border2:#3A4252;
  --text:#E6E9EF;--text2:#B4BCCB;--text3:#7C8698;
  --accent:#6EA8FE;--accent-l:#1B2740;--green:#4ADE9B;--green-l:#11281D;
  --amber:#F5B544;--amber-l:#2C2210;--red:#F48A8A;--red-l:#2F1617;--purple:#B79CFB;--purple-l:#231B38;
  --bc-bg:#1E3A8A;--bc-tx:#DCE7FE;--bp-bg:#6B4A10;--bp-tx:#FDF0CC;--ba-bg:#46288A;--ba-tx:#EDE5FF;--be-bg:#7F1D1D;--be-tx:#FDE2E2;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1117;--surface:#161A22;--surface2:#1E232D;--border:#2A303C;--border2:#3A4252;
  --text:#E6E9EF;--text2:#B4BCCB;--text3:#7C8698;
  --accent:#6EA8FE;--accent-l:#1B2740;--green:#4ADE9B;--green-l:#11281D;
  --amber:#F5B544;--amber-l:#2C2210;--red:#F48A8A;--red-l:#2F1617;--purple:#B79CFB;--purple-l:#231B38;
  --bc-bg:#1E3A8A;--bc-tx:#DCE7FE;--bp-bg:#6B4A10;--bp-tx:#FDF0CC;--ba-bg:#46288A;--ba-tx:#EDE5FF;--be-bg:#7F1D1D;--be-tx:#FDE2E2;
  color-scheme:dark;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{display:flex;height:100%}
.side{width:212px;flex:none;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:16px;border-bottom:1px solid var(--border);font-weight:700;font-size:15px}
.mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:15px}
.nav{padding:8px;display:flex;flex-direction:column;gap:2px}
.nav-grp{font-size:11px;color:var(--text3);padding:10px 10px 4px}
.nav button{display:flex;align-items:center;gap:8px;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;color:var(--text2);font-size:13px;white-space:nowrap}
.nav button:hover{background:var(--surface2)}
.nav button.on{background:var(--accent-l);color:var(--accent);font-weight:600}
.nav .cnt{margin-left:auto;background:var(--purple-l);color:var(--purple);border-radius:10px;padding:0 7px;font-size:11px}
.side-foot{margin-top:auto;padding:12px;border-top:1px solid var(--border);font-size:12px;color:var(--text3)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--border)}
.top h1{font-size:16px;font-weight:700}
.top .sub{font-size:12px;color:var(--text3)}
.grow{flex:1}
.wknav{display:flex;align-items:center;gap:6px}
.wknav .lbl{font-size:13px;font-weight:600;min-width:190px;text-align:center}
.content{flex:1;overflow:auto;padding:16px 18px 40px}
.btn{border:1px solid var(--border2);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:500}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.warn{color:var(--amber);border-color:var(--amber)}
.btn.dng{color:var(--red);border-color:var(--red)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
.card h2{font-size:15px;margin-bottom:10px}
.note{font-size:12px;color:var(--text3)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.stat .k{font-size:12px;color:var(--text2)}
.stat .v{font-size:26px;font-weight:700;letter-spacing:-.01em}
.stat .v small{font-size:13px;font-weight:500;color:var(--text3)}
.stat .d{font-size:11px;color:var(--text3)}
.chip{display:inline-flex;align-items:center;border-radius:20px;padding:1px 8px;font-size:11px;font-weight:600;white-space:nowrap}
.c-blue{background:var(--accent-l);color:var(--accent)}.c-green{background:var(--green-l);color:var(--green)}
.c-amber{background:var(--amber-l);color:var(--amber)}.c-red{background:var(--red-l);color:var(--red)}
.c-purple{background:var(--purple-l);color:var(--purple)}.c-gray{background:var(--surface2);color:var(--text2)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:12px;color:var(--text2);font-weight:600;padding:8px;border-bottom:1px solid var(--border);white-space:nowrap}
table.t td{padding:8px;border-bottom:1px solid var(--border);vertical-align:middle}
.tw{overflow-x:auto}
.meter{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;min-width:80px}
.meter i{display:block;height:100%;border-radius:4px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;flex:none}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--text2)}
.inp{border:1px solid var(--border2);background:var(--surface);border-radius:8px;padding:7px 9px;font-size:13px;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:flex;align-items:center;gap:4px;font-size:12px;border:1px solid var(--border2);border-radius:20px;padding:3px 9px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--text2);margin-bottom:10px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
/* timeline */
.tlwrap{overflow:auto;border:1px solid var(--border);border-radius:12px;background:var(--surface);max-height:calc(100vh - 200px)}
.tl{position:relative}
.tlr{display:flex;height:34px;border-bottom:1px solid var(--border)}
.tlr.head{height:30px;position:sticky;top:0;z-index:4;background:var(--surface2)}
.tlr.hrs{height:22px;position:sticky;top:30px;z-index:4;background:var(--surface2)}
.tlr.cnt{height:40px;position:sticky;top:52px;z-index:4;background:var(--surface)}
.tlr.store{height:30px;background:var(--surface2)}
.lab{width:var(--lab);flex:none;position:sticky;left:0;z-index:3;background:inherit;display:flex;align-items:center;padding:0 10px;font-size:12px;border-right:1px solid var(--border);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tlr:not(.head):not(.hrs):not(.cnt):not(.store) .lab{background:var(--surface)}
.trk{position:relative;flex:none;height:100%;
  background-image:linear-gradient(to right,var(--border2) 1px,transparent 1px),linear-gradient(to right,var(--border) 1px,transparent 1px);
  background-size:var(--dw) 100%,var(--cw) 100%}
.tday{position:absolute;top:0;height:100%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;border-left:1px solid var(--border2)}
.tday.sat{color:var(--accent)}.tday.sun{color:var(--red)}
.thr{position:absolute;top:0;width:var(--cw);text-align:center;font-size:10px;color:var(--text3);line-height:22px}
.tcn{position:absolute;bottom:0;width:var(--cw);height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.tcn span{font-size:10px;font-weight:700;color:var(--accent);line-height:12px}
.tcn i{display:block;width:70%;background:var(--accent);opacity:.28;border-radius:2px 2px 0 0}
.tcn.low span{color:var(--red)}.tcn.low i{background:var(--red)}
.bar{position:absolute;top:4px;height:26px;border-radius:5px;font-size:11px;font-weight:600;padding:0 6px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;border:0;text-align:left}
.b-confirmed{background:var(--bc-bg);color:var(--bc-tx);box-shadow:inset 3px 0 0 #3B82F6}
.b-provisional{background:var(--bp-bg);color:var(--bp-tx);box-shadow:inset 3px 0 0 #F59E0B}
.b-applied{background:var(--ba-bg);color:var(--ba-tx);box-shadow:inset 3px 0 0 #8B5CF6}
.b-err{background:var(--be-bg);color:var(--be-tx);box-shadow:inset 3px 0 0 #EF4444}
.memo{position:absolute;top:4px;height:22px;border-radius:6px;border:1px dashed var(--amber);background:var(--amber-l);color:var(--amber);font-size:11px;padding:0 8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.memo.has{border-style:solid}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.ov.open{display:flex}
.mdl{background:var(--surface);border-radius:14px;padding:18px;width:520px;max-width:100%;max-height:88vh;overflow:auto}
.mdl h3{font-size:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.mdl .x{border:0;background:none;font-size:22px;color:var(--text3);line-height:1}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.alert{border-radius:8px;padding:9px 12px;font-size:12px;margin:10px 0}
.alert.r{background:var(--red-l);color:var(--red)}.alert.a{background:var(--amber-l);color:var(--amber)}.alert.b{background:var(--accent-l);color:var(--accent)}.alert.g{background:var(--green-l);color:var(--green)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 14px;font-size:13px;color:var(--text2);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.prow{display:grid;grid-template-columns:150px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);align-items:start}
.prow:last-child{border-bottom:0}
.reasons{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.grade{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;font-weight:800;font-size:12px}
.gA{background:var(--green-l);color:var(--green)}.gB{background:var(--accent-l);color:var(--accent)}.gC{background:var(--amber-l);color:var(--amber)}.gD{background:var(--red-l);color:var(--red)}
.ccard{display:flex;gap:12px;align-items:flex-start}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;color:#1f2937}
.myshift{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;background:var(--surface)}
@media (max-width:780px){
  .shell{flex-direction:column}
  .side{width:100%;border-right:0;border-bottom:1px solid var(--border)}
  .brand{padding:10px 14px}
  .nav{flex-direction:row;overflow-x:auto;padding:6px}
  .nav-grp,.side-foot{display:none}
  .content{padding:12px 12px 40px}
  .grid2{grid-template-columns:1fr}
  .prow{grid-template-columns:1fr}
  .wknav .lbl{min-width:0}
  :root{--lab:96px}
  .tlwrap{max-height:none}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

.gate{position:fixed;inset:0;background:var(--bg);z-index:40;display:none;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));overflow:auto}
.gate.open{display:flex}
.gcard{width:420px;max-width:100%}
.gcard h2{font-size:17px;margin:14px 0 10px}
.block{width:100%;padding:10px;font-size:14px}
.sep{border:0;border-top:1px solid var(--border);margin:18px 0}
.busy{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;font-size:12px;padding:5px 12px;border-radius:20px;z-index:70;display:none}
.busy.on{display:block}
.err{color:var(--red);font-size:12px;min-height:18px;margin-top:6px}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><div class="mark">📅</div>シフト管理</div>
    <nav class="nav" id="nav">
      <div class="nav-grp adm">管理者</div>
      <button class="adm" data-v="shift">シフト表</button>
      <button class="adm" data-v="propose">自動シフト提案</button>
      <button class="adm" data-v="rate">希望達成率</button>
      <button class="adm" data-v="att">勤怠記録・信頼度</button>
      <button class="adm" data-v="apps">申請一覧 <span class="cnt" id="appCnt">0</span></button>
      <button class="adm" data-v="crew">クルー管理</button>
      <div class="nav-grp adm">クルー</div>
      <button data-v="me">クルー画面</button>
    </nav>
    <div class="side-foot" id="foot"></div>
  </aside>
  <div class="main">
    <header class="top">
      <div><h1 id="ttl">シフト表</h1><div class="sub" id="sub"></div></div>
      <div class="grow"></div>
      <div class="wknav" id="wknav">
        <button class="btn sm" onclick="moveWk(-1)" aria-label="前の週">◀</button>
        <span class="lbl" id="wkLbl"></span>
        <button class="btn sm" onclick="moveWk(1)" aria-label="次の週">▶</button>
        <button class="btn sm" onclick="wk=0;render()">今週</button>
      </div>
      <div class="row" id="topActs"></div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<div class="gate" id="gate"></div>
<div class="ov" id="ov" onclick="if(event.target===this)closeM()"><div class="mdl" role="dialog" aria-modal="true"><h3><span id="mTtl"></span><button class="x" onclick="closeM()" aria-label="閉じる">×</button></h3><div id="mBody"></div></div></div>
<div class="toast" id="toast"></div>
<div class="busy" id="busy">通信中…</div>
<script>
/* ===== 設定 ===== */
const API_URL=''; // ← GASのウェブアプリURLをここに貼ると、開いた人は全員そのまま本番に接続されます（空なら最初に選択画面）

const STORES=['高田町店','次屋三丁目店','立花駅南店','内環豊中服部寿町店','伏尾台店'];
const PREF=['兵庫','兵庫','兵庫','大阪','大阪'];
const DAYS=['月','火','水','木','金','土','日'];
const SLOT={am:{n:'早番',s:7,e:15},pm:{n:'遅番',s:15,e:23}};
const VISAS=['日本国籍','永住者','定住者','日本人の配偶者等','特定技能','技術・人文知識・国際業務','留学','家族滞在','特定活動'];
const COLORS=['#93C5FD','#86EFAC','#FCD34D','#F9A8D4','#C4B5FD','#FCA5A5','#67E8F9','#FDBA74','#A7F3D0','#D8B4FE'];
const HS=6,HE=24,CW=26,DW=(HE-HS)*CW,KEY='shiftapp_v3';
const TODAY=new Date();TODAY.setHours(0,0,0,0);
const BASE=new Date(TODAY);BASE.setDate(TODAY.getDate()-((TODAY.getDay()+6)%7));
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
let MODE=API_URL?'live':(LS.get('shift_mode')||''),URL_=API_URL||LS.get('shift_api')||'';
let AUTH=null;try{AUTH=JSON.parse(LS.get('shift_auth')||'null')}catch(e){}
let ROLE='admin',S=null,wk=0,view='shift',PROP=null,editId=null,meTab='mine',meId=null,storeF='all',propStores=[0,1,2,3,4],gateTab='admin';

const $=q=>document.querySelector(q);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function wkStart(w){const d=new Date(BASE);d.setDate(BASE.getDate()+w*7);return d}
function dDate(w,i){const d=wkStart(w);d.setDate(d.getDate()+i);return d}
const wsOf=w=>ymd(wkStart(w));
function wkOf(ws){const p=String(ws).split('-').map(Number);return Math.round((new Date(p[0],p[1]-1,p[2])-BASE)/(7*864e5))}
const md=d=>(d.getMonth()+1)+'/'+d.getDate();
const wkLabel=w=>`${md(wkStart(w))}（月）〜${md(dDate(w,6))}（日）`;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),3000)}
function openM(t,h){$('#mTtl').textContent=t;$('#mBody').innerHTML=h;$('#ov').classList.add('open')}
function closeM(){$('#ov').classList.remove('open')}
const crew=id=>S.crew.find(c=>c.id===id);
const hrs=s=>s.endH-s.startH;
const capOf=c=>c.visa==='留学'?28:40;
const desOf=c=>Math.min(+c.desired||0,capOf(c));
const pct=x=>Math.round(x*100)+'%';
const memoKey=(w,si,d)=>`${wsOf(w)}_${si}_${d}`;

/* ===== デモデータ ===== */
function demo(){
  const C=(n,name,home,role,desired,days,pref,stores,visa,nat,exp)=>({id:'c'+n,code:String(1000+n),pin:'0000',name,home,role,desired,days,pref,stores,visa:visa||'日本国籍',nationality:nat||'日本',visaExp:exp||'',phone:'090-0000-'+(1000+n),email:'',address:'',color:COLORS[(n-1)%COLORS.length]});
  const exp=new Date(TODAY);exp.setDate(exp.getDate()+75);

function busy(on){$('#busy').classList.toggle('on',on)}
async function post(body){
  const r=await fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
  return r.json();
}
async function api(action,body={}){
  busy(true);
  try{const j=await post({action,token:AUTH&&AUTH.token,...body});
    if(!j.ok){if(j.error==='AUTH'){toast('ログインの有効期限が切れました。もう一度ログインしてください');logout(true);return null}toast(j.error||'通信に失敗しました');return null}
    return j;
  }catch(e){toast('通信に失敗しました。電波を確認して「更新」を押してください');return null}
  finally{busy(false)}
}
const num=v=>v===''||v==null?0:+v;

/* 保存処理（デモ＝端末内／本番＝スプレッドシート） */
async function putShifts(list,removeIds=[]){
  if(MODE==='demo'){
    const rej=[];S.shifts=S.shifts.filter(s=>!removeIds.includes(s.id));
    list.forEach(r=>{const prev=S.shifts.find(x=>x.id===r.id);const m={...(prev||{}),...r};
      if(m.status==='confirmed'&&conflict(m)){rej.push(r.id);return}
      const was=prev&&prev.status;if(prev)Object.assign(prev,m);else S.shifts.push(m);
      if(m.status==='confirmed'&&was!=='confirmed')S.notices.push({id:uid(),crewId:m.crewId,text:`${md(dDate(m.wk,m.day))}（${DAYS[m.day]}） ${STORES[m.store]} ${m.startH}:00〜${m.endH}:00 が確定しました`,read:''})});
    saveLocal();render();return rej;
  }
  const j=await api('bulkShifts',{rows:list.map(shOut),removeIds});if(!j)return null;await reload();return j.rejected||[];
}
function rowOut(t,r){
  if(t==='Crew')return {...r,days:JSON.stringify(r.days),stores:JSON.stringify(r.stores)};
  if(t==='Attendance')return {id:r.id,crewId:r.crewId,ws:wsOf(r.wk),day:r.day,type:r.type,min:r.min,slot:r.slot,note:r.note,createdAt:new Date().toISOString()};
  return r;
}
async function putRow(t,r,noReload){
  if(MODE==='demo'){
    if(t==='Crew'){const c=crew(r.id);c?Object.assign(c,r):S.crew.push(r)}
    else if(t==='Attendance')S.att.push(r);
    else if(t==='Memos')S.memos[r.id]=r.text;
    saveLocal();if(!noReload)render();return true;
  }
  const j=await api('upsert',{table:t,row:rowOut(t,r)});if(!j)return false;if(!noReload)await reload();return true;
}
async function delRow(t,id){
  if(MODE==='demo'){
    if(t==='Crew'){S.crew=S.crew.filter(c=>c.id!==id);S.shifts=S.shifts.filter(s=>s.crewId!==id)}
    if(t==='Attendance')S.att=S.att.filter(a=>a.id!==id);
    saveLocal();render();return true;
  }
  const j=await api('remove',{table:t,id});if(!j)return false;await reload();return true;
}
function setSetting(k,v){
  if(k==='wage_hyogo')S.wage.兵庫=+v;if(k==='wage_osaka')S.wage.大阪=+v;if(k==='req_am')S.req.am=+v;if(k==='req_pm')S.req.pm=+v;

}

/* ===== ロジック ===== */
function conflict(s){return S.shifts.some(o=>o.id!==s.id&&o.crewId===s.crewId&&o.wk===s.wk&&o.day===s.day&&o.startH<s.endH&&s.startH<o.endH)}
function crewHours(cid,w){return S.shifts.filter(s=>s.crewId===cid&&s.wk===w&&s.status!=='applied').reduce((a,s)=>a+hrs(s),0)}
function pay(s){const w=S.wage[PREF[s.store]];let p=0;for(let h=s.startH;h<s.endH;h++)p+=w*((h>=22||h<5)?1.25:1);return Math.round(p)}
function pendingAbs(cid){const c=crew(cid),ia=(c&&c.interviewAt)||'';return S.att.filter(a=>a.crewId===cid&&a.type==='absent'&&ymd(dDate(a.wk,a.day))>ia)}
const needInterview=cid=>pendingAbs(cid).length>0;
function attStats(cid,ref){
  const recs=S.att.filter(a=>a.crewId===cid&&a.wk<=ref&&a.wk>ref-8);
  const c={absent:0,late:0,change:0,early:0};let pen=0;
  recs.forEach(a=>{const w=(ref-a.wk)<4?1:.5;c[a.type]=(c[a.type]||0)+1;
    pen+=({absent:15,late:5+Math.min(10,Math.floor((a.min||0)/15)*2),change:4,early:5}[a.type]||0)*w});
  const score=Math.max(0,Math.round(100-pen)),grade=score>=90?'A':score>=75?'B':score>=60?'C':'D',rules=[];
  const pa=pendingAbs(cid);
  if(pa.length)rules.push({k:'interview',t:`当日欠勤（${pa.map(a=>md(dDate(a.wk,a.day))).join('・')}）→ 要面談。面談済みにするまで提案に入れない`});
  const late=recs.filter(a=>a.type==='late');
  if(late.length>=2){const keys=[...new Set(late.map(a=>a.day+'_'+a.slot))];
    rules.push({k:'lateShift',keys,t:`遅刻${late.length}回（${keys.map(k=>{const[d,sl]=k.split('_');return DAYS[d]+'曜'+(SLOT[sl]?SLOT[sl].n:'')}).join('・')}）→ 同じ曜日・時間帯は1時間ずらして提案`})}
  if(c.change>=2)rules.push({k:'backup',t:`直前変更${c.change}回 → 予備要員を自動でセット`});
  else if(score<70)rules.push({k:'backup',t:`信頼スコア${score} → 予備要員を自動でセット`});
  return {score,grade,c,rules};
}
async function markInterview(id){const c=crew(id);if(!confirm(`${c.name}さんを面談済みにしますか？次回から提案の対象に戻ります`))return;
  if(await putRow('Crew',{...c,interviewAt:ymd(TODAY)}))toast(`${c.name}さんを面談済みにしました`)}
const ivChip=id=>needInterview(id)?`<span class="chip c-red">要面談</span>`:'';
function rateData(w,extra){
  const rows=S.crew.filter(c=>c.days).map(c=>{const des=desOf(c);const a=crewHours(c.id,w)+((extra&&extra[c.id])||0);return {c,des,a,ach:des?a/des:1,short:Math.max(0,des-a)}}).filter(x=>x.des>0);
  const n=rows.length||1,under=rows.filter(x=>x.a<x.des);
  return {rows,avg:rows.reduce((s,x)=>s+Math.min(x.ach,1),0)/n,underRate:under.length/n,under:under.length,shortH:under.reduce((s,x)=>s+x.short,0),over:rows.filter(x=>x.a>x.des).length,n:rows.length};
}

  let h=`<div class="card"><h2>提案の条件</h2><div class="grid2">
   <div class="field"><label>早番（7〜15時）の必要人数／店</label><input id="rAm" type="number" min="0" max="5" class="inp" value="${S.req.am}"></div>

function makeProposal(){
  const am=+$('#rAm').value||0,pm=+$('#rPm').value||0;
  if(am!==S.req.am)setSetting('req_am',am);if(pm!==S.req.pm)setSetting('req_pm',pm);
  propStores=[...document.querySelectorAll('.pS:checked')].map(x=>+x.value);
  const tw=wk+1,ref=tw-1;
  const keep=S.shifts.filter(s=>s.wk===tw&&!(s.auto&&s.status!=='confirmed'));
  const assigned={},busyD=[...Array(7)].map(()=>new Set()),st={};
  S.crew.forEach(c=>{assigned[c.id]=keep.filter(s=>s.crewId===c.id&&s.status!=='applied').reduce((a,s)=>a+hrs(s),0);st[c.id]=attStats(c.id,ref)});
  keep.forEach(s=>busyD[s.day].add(s.crewId));
  const slots=[];
  for(let d=0;d<7;d++)propStores.forEach(si=>['am','pm'].forEach(k=>{
    const have=keep.filter(s=>s.day===d&&s.store===si&&s.status!=='applied'&&s.startH<SLOT[k].e&&SLOT[k].s<s.endH).length;
    for(let i=0;i<S.req[k]-have;i++)slots.push({d,si,k})}));
  const elig=(c,sl)=>!needInterview(c.id)&&c.days.includes(sl.d)&&c.stores.includes(sl.si)&&!busyD[sl.d].has(c.id)&&assigned[c.id]+8<=Math.min(capOf(c),desOf(c)+4)&&assigned[c.id]<desOf(c);
  const score=(c,sl)=>{const r=[],s=st[c.id],des=desOf(c),rem=des-assigned[c.id];
    let sc=s.score+(rem/des)*20;r.push(`信頼${s.grade}（${s.score}）`);r.push(`希望まで残り${rem}h`);
    if(c.home===sl.si){sc+=5;r.push('所属店')}
    if(c.pref!=='any'){if(c.pref===sl.k){sc+=8;r.push('希望の時間帯')}else{sc-=8;r.push('時間帯は希望外')}}
    return {sc:Math.round(sc),r}};
  slots.forEach(sl=>sl.n=S.crew.filter(c=>elig(c,sl)).length);slots.sort((a,b)=>a.n-b.n);
  const res=[],short=[];
  slots.forEach(sl=>{
    const cands=S.crew.filter(c=>elig(c,sl)).map(c=>({c,...score(c,sl)})).sort((a,b)=>b.sc-a.sc);
    if(!cands.length){short.push(sl);return}
    const top=cands[0];assigned[top.c.id]+=8;busyD[sl.d].add(top.c.id);
    const lr=st[top.c.id].rules.find(r=>r.k==='lateShift');
    res.push({...sl,crewId:top.c.id,sc:top.sc,r:top.r,s:SLOT[sl.k].s,e:SLOT[sl.k].e,shifted:!!(lr&&lr.keys.includes(sl.d+'_'+sl.k)),backup:null});
  });
  /* 遅刻対策の1時間ずらし：抜けた1時間を他のメンバーで埋められるか確認 */
  const nm=id=>crew(id).name;
  const covered=(x,h)=>keep.some(s=>s.store===x.si&&s.day===x.d&&s.status!=='applied'&&s.crewId!==x.crewId&&s.startH<=h&&h<s.endH)||res.some(y=>y!==x&&y.si===x.si&&y.d===x.d&&y.s<=h&&h<y.e);
  res.filter(x=>x.shifted).forEach(x=>{
    const opt=off=>{const s=x.s+off,e=x.e+off;if(s<0||e>24)return null;const gap=off>0?x.s:x.e-1;
      if(covered(x,gap))return {off,s,e,gap,how:'covered'};
      const adj=res.find(y=>y!==x&&!y.shifted&&y.si===x.si&&y.d===x.d&&(off>0?y.e===x.s:y.s===x.e)&&assigned[y.crewId]+1<=capOf(crew(y.crewId))&&(off>0?y.e+1<=24:y.s-1>=0));
      if(adj)return {off,s,e,gap,how:'extend',adj};
      return {off,s,e,gap,how:'gap'}};
    const pick=opt(1)||opt(-1);
    x.s=pick.s;x.e=pick.e;x.r.push(`遅刻対策で1時間ずらし`);
    if(pick.how==='extend'){const y=pick.adj;if(pick.off>0)y.e+=1;else y.s-=1;assigned[y.crewId]+=1;
      y.r.push(`${nm(x.crewId)}さんのずらしに合わせて${pick.gap}時台を延長`);x.r.push(`${pick.gap}時台は${nm(y.crewId)}さんが延長`)}
    else if(pick.how==='covered')x.r.push(`${pick.gap}時台は他のメンバーで足りている`);
    else x.gap=pick.gap;
  });
  /* 予備要員 */
  res.forEach(x=>{if(st[x.crewId].rules.some(r=>r.k==='backup')){
    const b=S.crew.filter(c=>c.id!==x.crewId&&!needInterview(c.id)&&c.days.includes(x.d)&&c.stores.includes(x.si)&&!busyD[x.d].has(c.id)&&st[c.id].score>=75).sort((a,b)=>st[b.id].score-st[a.id].score)[0];
    if(b)x.backup=b.id}});
  const extra={};res.forEach(x=>extra[x.crewId]=(extra[x.crewId]||0)+(x.e-x.s));
  PROP={tw,res:res.sort((a,b)=>a.d-b.d||a.si-b.si||a.s-b.s),short,total:slots.length,before:rateData(tw),after:rateData(tw,extra),
    avgRel:res.length?Math.round(res.reduce((a,x)=>a+st[x.crewId].score,0)/res.length):0,
    held:S.crew.filter(c=>needInterview(c.id)).map(c=>c.id)};
  render();
}
function renderProposal(P){
  let h=`<div class="stats">
   <div class="stat"><div class="k">充足した枠</div><div class="v">${P.res.length}<small> / ${P.total}</small></div><div class="d">人員不足 ${P.short.length}枠</div></div>
   <div class="stat"><div class="k">反映後の希望達成率</div><div class="v">${pct(P.after.avg)}</div><div class="d">反映前 ${pct(P.before.avg)}</div></div>
   <div class="stat"><div class="k">反映後の希望未達率</div><div class="v">${pct(P.after.underRate)}</div><div class="d">もっと働きたい人 ${P.after.under}人（反映前 ${P.before.under}人）</div></div>
   <div class="stat"><div class="k">割当クルーの平均信頼スコア</div><div class="v">${P.avgRel}</div><div class="d">予備要員つき ${P.res.filter(x=>x.backup).length}枠・1時間ずらし ${P.res.filter(x=>x.shifted).length}枠</div></div></div>
   ${P.held.length?`<div class="card"><h2>要面談のため提案に入れていないクルー</h2>${P.held.map(id=>`<div class="prow"><div><span class="dot" style="background:${crew(id).color}"></span><b>${esc(crew(id).name)}</b> <span class="chip c-red">要面談</span></div><div class="row"><span class="note">当日欠勤 ${pendingAbs(id).map(a=>md(dDate(a.wk,a.day))).join('・')}</span><button class="btn sm" onclick="markInterview('${id}')">面談済みにする</button></div></div>`).join('')}<p class="note" style="margin-top:8px">面談済みにしてから「提案を作成」を押し直すと、提案に入ります。</p></div>`:''}
   <div class="card"><div class="row" style="justify-content:space-between;margin-bottom:6px"><h2 style="margin:0">提案内容</h2><button class="btn pri" onclick="applyProposal()">仮確定でシフト表に反映</button></div>`;
  for(let d=0;d<7;d++){const items=P.res.filter(x=>x.d===d),sh=P.short.filter(x=>x.d===d);if(!items.length&&!sh.length)continue;
    h+=`<div style="font-weight:700;margin:12px 0 4px;color:${d==5?'var(--accent)':d==6?'var(--red)':'var(--text)'}">${DAYS[d]} ${md(dDate(P.tw,d))}</div>`;
    items.forEach(x=>{const c=crew(x.crewId),b=x.backup&&crew(x.backup);
      h+=`<div class="prow"><div style="font-size:12px">${STORES[x.si]}<br><b>${SLOT[x.k].n} ${x.s}〜${x.e}</b></div><div><span class="dot" style="background:${c.color}"></span><b>${esc(c.name)}</b> <span class="note">スコア${x.sc}</span>
       <div class="reasons">${x.r.map(t=>`<span class="chip ${/希望外|ずらし|延長/.test(t)?'c-amber':'c-gray'}">${t}</span>`).join('')}${x.gap!=null?`<span class="chip c-red">${x.gap}〜${x.gap+1}時 人員要確認</span>`:''}${b?`<span class="chip c-purple">予備：${esc(b.name)}</span>`:''}</div></div></div>`});
    sh.forEach(x=>h+=`<div class="prow"><div style="font-size:12px">${STORES[x.si]}<br><b>${SLOT[x.k].n}</b></div><div><span class="chip c-red">人員不足</span> <span class="note">条件に合うクルーがいません。採用・他店応援の検討枠です。</span></div></div>`);
  }
  return h+`</div>`;
}
async function applyProposal(){
  const P=PROP;const removeIds=S.shifts.filter(s=>s.wk===P.tw&&s.auto&&s.status!=='confirmed').map(s=>s.id);
  const rows=P.res.map(x=>({id:uid(),crewId:x.crewId,store:x.si,day:x.d,startH:x.s,endH:x.e,status:'provisional',wk:P.tw,auto:true}));
  wk=P.tw;view='shift';PROP=null;
  if(await putShifts(rows,removeIds))toast(`${rows.length}件を仮確定で反映しました。確認して確定してください`);
}

/* ===== 申請一覧 ===== */
function vApps(){
  const list=S.shifts.filter(s=>s.status==='applied').sort((a,b)=>a.wk-b.wk||a.day-b.day);
  let h=`<div class="card"><h2>申請中のシフト（全週）</h2>${list.length?'':'<p class="note">申請中のシフトはありません。</p>'}`;
  list.forEach(s=>{const c=crew(s.crewId);if(!c)return;const err=conflict(s);
    h+=`<div class="prow"><div><span class="dot" style="background:${c.color}"></span><b>${esc(c.name)}</b><div class="note">${wkLabel(s.wk)}</div></div><div>
     <div>${DAYS[s.day]} ${md(dDate(s.wk,s.day))}　${STORES[s.store]}　${s.startH}:00〜${s.endH}:00</div>
     ${err?`<div class="alert r" style="margin:6px 0">⚠ 同じ日の他店シフトと重なっています。確定できません。</div>`:''}
     <div class="row" style="margin-top:6px"><button class="btn sm warn" onclick="setSt('${s.id}','provisional')">仮確定</button><button class="btn sm pri" ${err?'disabled':''} onclick="setSt('${s.id}','confirmed')">確定</button><button class="btn sm dng" onclick="rejectApp('${s.id}')">却下</button></div></div></div>`});
  $('#view').innerHTML=h+`</div>`;
}
async function setSt(id,st){const s=S.shifts.find(x=>x.id===id);if(st==='confirmed'&&conflict(s))return toast('⚠ 重なっているため確定できません');
  const rej=await putShifts([{...s,status:st}]);if(rej)toast(rej.length?'⚠ 重なっているため確定できませんでした':st==='confirmed'?'確定しました。クルーに通知しました':'仮確定しました')}
async function rejectApp(id){if(await putShifts([],[id]))toast('申請を却下しました')}

/* ===== クルー管理 ===== */
function vCrew(){
  let h=`<div class="row" style="justify-content:space-between;margin-bottom:12px"><div class="row"><span class="note">最低賃金（2026年10月1日〜）</span>
   兵庫 <input type="number" class="inp" style="width:90px" value="${S.wage.兵庫}" onchange="setSetting('wage_hyogo',this.value)">円
   大阪 <input type="number" class="inp" style="width:90px" value="${S.wage.大阪}" onchange="setSetting('wage_osaka',this.value)">円</div>
   <button class="btn pri" onclick="openCrew(null)">＋ クルー追加</button></div>`;
  S.crew.forEach(c=>{const days=c.visaExp?Math.round((new Date(c.visaExp+'T00:00:00')-TODAY)/864e5):null;
    h+=`<div class="card ccard"><div class="av" style="background:${c.color}">${esc(c.name.slice(0,1))}</div><div style="flex:1;min-width:0">
     <div class="row" style="gap:6px"><b style="font-size:15px">${esc(c.name)}</b><span class="chip c-blue">${esc(c.role)}</span>${ivChip(c.id)}${needInterview(c.id)?`<button class="btn sm" onclick="markInterview('${c.id}')">面談済みにする</button>`:c.interviewAt?`<span class="note">面談 ${esc(c.interviewAt)}</span>`:''}
     ${days!==null&&days<=90?`<span class="chip c-red">在留期限まで${days}日</span>`:''}${c.visa==='留学'?'<span class="chip c-amber">週28h上限</span>':''}</div>
     <div class="note" style="margin-top:4px">📞 ${esc(c.phone)}　🏪 ${STORES[c.home]}　🌏 ${esc(c.nationality)}／${esc(c.visa)}${c.visaExp?'（'+c.visaExp+'まで）':''}</div>
     <div class="note">🏠 ${esc(c.address)||'住所未登録'}　✉ ${esc(c.email)||'メール未登録（確定通知メールは届きません）'}</div>
     <div class="note">希望 週${c.desired}h・${c.days.map(d=>DAYS[d]).join('')}・${{am:'早番希望',pm:'遅番希望',any:'時間帯どちらでも'}[c.pref]}・勤務可能店 ${c.stores.map(i=>STORES[i].replace('店','')).join('／')}</div>
     <div class="note">🔑 ログインコード <b>${esc(c.code)}</b>　PIN <b>${esc(c.pin)}</b></div>
    </div><button class="btn sm" onclick="openCrew('${c.id}')">編集</button></div>`});
  $('#view').innerHTML=h;
}
function newCode(){let c;do{c=String(Math.floor(1000+Math.random()*9000))}while(S.crew.some(x=>x.code===c));return c}
function openCrew(id){
  const c=id?crew(id):{name:'',phone:'',email:'',address:'',nationality:'日本',visa:'日本国籍',visaExp:'',home:0,role:'クルー',desired:24,days:[0,1,2,3,4],pref:'any',stores:[0],code:newCode(),pin:String(Math.floor(1000+Math.random()*9000))};
  const f=(k,l,t='text',full)=>`<div class="field"${full?' style="grid-column:1/-1"':''}><label>${l}</label><input id="cf_${k}" type="${t}" class="inp" value="${esc(c[k])}"></div>`;
  openM(id?'クルー情報の編集':'クルー登録',`<div class="grid2">${f('name','名前')}${f('phone','電話番号','tel')}${f('email','メール（確定通知用）','email',1)}${f('address','住所','text',1)}
   ${f('nationality','国籍')}<div class="field"><label>在留資格</label><select id="cf_visa" class="inp">${VISAS.map(v=>`<option ${v===c.visa?'selected':''}>${v}</option>`).join('')}</select></div>
   ${f('visaExp','在留期限','date')}<div class="field"><label>所属店舗</label><select id="cf_home" class="inp">${STORES.map((s,i)=>`<option value="${i}" ${i==c.home?'selected':''}>${s}</option>`).join('')}</select></div>
   <div class="field"><label>役職</label><select id="cf_role" class="inp">${['クルー','サブリーダー','リーダー'].map(r=>`<option ${r===c.role?'selected':''}>${r}</option>`).join('')}</select></div>
   <div class="field"><label>希望勤務時間（週）</label><input id="cf_desired" type="number" class="inp" value="${c.desired}"></div>
   <div class="field"><label>希望の時間帯</label><select id="cf_pref" class="inp">${[['any','どちらでも'],['am','早番'],['pm','遅番']].map(([k,v])=>`<option value="${k}" ${k===c.pref?'selected':''}>${v}</option>`).join('')}</select></div>
   ${f('code','ログインコード')}${f('pin','PIN')}</div>
   <div class="field" style="margin-top:10px"><label>勤務できる曜日</label><div class="checks">${DAYS.map((d,i)=>`<label><input type="checkbox" class="cfD" value="${i}" ${c.days.includes(i)?'checked':''}>${d}</label>`).join('')}</div></div>
   <div class="field" style="margin-top:10px"><label>勤務できる店舗</label><div class="checks">${STORES.map((s,i)=>`<label><input type="checkbox" class="cfS" value="${i}" ${c.stores.includes(i)?'checked':''}>${s}</label>`).join('')}</div></div>
   <div class="acts">${id?`<button class="btn dng" onclick="delCrew('${id}')">削除</button><div class="grow"></div>`:''}<button class="btn" onclick="closeM()">キャンセル</button><button class="btn pri" onclick="saveCrew('${id||''}')">保存</button></div>`);
}
async function delCrew(id){if(!confirm('このクルーとシフトを削除しますか？'))return;closeM();if(await delRow('Crew',id))toast('削除しました')}
async function saveCrew(id){
  const g=k=>$('#cf_'+k).value.trim();if(!g('name'))return toast('名前を入れてください');
  if(!/^\d{4,8}$/.test(g('code'))||S.crew.some(x=>x.code===g('code')&&x.id!==id))return toast('ログインコードは他の人と重ならない4〜8桁の数字にしてください');
  if(!/^\d{4,8}$/.test(g('pin')))return toast('PINは4〜8桁の数字にしてください');
  const d={id:id||uid(),name:g('name'),phone:g('phone'),email:g('email'),address:g('address'),nationality:g('nationality'),visa:g('visa'),visaExp:g('visaExp'),home:+g('home'),role:g('role'),desired:+g('desired')||0,pref:g('pref'),code:g('code'),pin:g('pin'),
    days:[...document.querySelectorAll('.cfD:checked')].map(x=>+x.value),stores:[...document.querySelectorAll('.cfS:checked')].map(x=>+x.value),color:id?crew(id).color:COLORS[S.crew.length%COLORS.length]};
  if(!d.stores.includes(d.home))d.stores.push(d.home);
  closeM();if(await putRow('Crew',d))toast('保存しました');
}

/* ===== クルー画面 ===== */
function vMe(){
  if(ROLE!=='crew'&&(!meId||!crew(meId)))meId=S.crew[0]?.id;
  const c=crew(meId);if(!c){$('#view').innerHTML='<p class="note">クルーが登録されていません。</p>';return}
  const mine=S.shifts.filter(s=>s.crewId===c.id&&s.wk===wk).sort((a,b)=>a.day-b.day||a.startH-b.startH);
  const conf=mine.filter(s=>s.status!=='applied'),H=conf.reduce((a,s)=>a+hrs(s),0),yen=conf.reduce((a,s)=>a+pay(s),0),des=desOf(c);
  const nt=S.notices.filter(n=>n.crewId===c.id&&!n.read);
  let h=ROLE==='crew'?`<p style="margin-bottom:10px"><b style="font-size:16px">${esc(c.name)} さん</b> <span class="note">${STORES[c.home]}</span></p>`
    :`<div class="row" style="margin-bottom:12px"><span class="note">表示するクルー</span><select class="inp" style="width:auto" onchange="meId=this.value;render()">${S.crew.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>`;
  if(nt.length)h+=`<div class="alert b"><b>🔔 新しく確定したシフト</b>${nt.slice(-8).map(t=>`<div>${esc(t.text)}</div>`).join('')}<button class="btn sm" style="margin-top:6px" onclick="ack()">確認しました</button></div>`;
  h+=`<div class="stats"><div class="stat"><div class="k">この週の勤務</div><div class="v">${H}<small> h</small></div><div class="d">希望 ${des}h（達成 ${pct(des?Math.min(H/des,1):1)}）</div></div>
   <div class="stat"><div class="k">この週の給与見込み</div><div class="v">¥${yen.toLocaleString()}</div><div class="d">月の見込み ¥${Math.round(yen*4.3).toLocaleString()}（22時以降は25%増）</div></div></div>
   <div class="tabs">${[['mine','自分のシフト'],['apply','シフト申請'],['store','店舗のシフト']].map(([k,v])=>`<button class="${meTab===k?'on':''}" onclick="meTab='${k}';render()">${v}</button>`).join('')}</div>`;
  if(meTab==='mine'){
    if(!mine.length)h+=`<p class="note">この週のシフトはまだありません。「シフト申請」から希望を出せます。</p>`;
    mine.forEach(s=>h+=`<div class="myshift"><div style="width:52px;text-align:center"><b>${DAYS[s.day]}</b><div class="note">${md(dDate(s.wk,s.day))}</div></div><div style="flex:1"><b style="font-size:15px">${s.startH}:00〜${s.endH}:00</b><div class="note">${STORES[s.store]}・${hrs(s)}時間</div></div><span class="chip ${s.status==='confirmed'?'c-blue':s.status==='provisional'?'c-amber':'c-purple'}">${{confirmed:'確定',provisional:'仮確定',applied:'申請中'}[s.status]}</span></div>`);
  }else if(meTab==='apply'){
    const o=a=>`<option value="">—</option>`+a.map(x=>`<option>${x}</option>`).join('');
    const st=Array.from({length:18},(_,i)=>i+6),en=Array.from({length:18},(_,i)=>i+7);
    h+=`<div class="card"><p class="note" style="margin-bottom:8px">${wkLabel(wk)} の希望を入力してください（入れた日だけ申請されます）</p>`;
    DAYS.forEach((d,i)=>h+=`<div class="row" style="padding:6px 0;border-bottom:1px solid var(--border);flex-wrap:nowrap"><b style="width:56px;flex:none">${d} ${md(dDate(wk,i))}</b><select id="ap_s${i}" class="inp" style="width:68px">${o(st)}</select>〜<select id="ap_e${i}" class="inp" style="width:68px">${o(en)}</select><select id="ap_t${i}" class="inp">${(c.stores||[c.home]).map(si=>`<option value="${si}" ${si===c.home?'selected':''}>${STORES[si]}</option>`).join('')}</select></div>`);
    h+=`<div class="acts"><button class="btn pri" onclick="submitApply()">申請する</button></div></div>`;
  }else{
    h+=`<div class="card"><h2>${STORES[c.home]} のこの週のシフト</h2>`;
    for(let d=0;d<7;d++){const list=S.shifts.filter(s=>s.wk===wk&&s.store===c.home&&s.day===d&&s.status!=='applied').sort((a,b)=>a.startH-b.startH);
      h+=`<div class="prow"><div><b>${DAYS[d]}</b> ${md(dDate(wk,d))}</div><div>${list.length?list.map(s=>`<div><span class="dot" style="background:${crew(s.crewId)?.color||'#ccc'}"></span>${esc(crew(s.crewId)?.name||'')}　${s.startH}:00〜${s.endH}:00${s.status==='provisional'?' <span class="chip c-amber">仮</span>':''}</div>`).join(''):'<span class="note">シフトなし</span>'}</div></div>`}
    h+=`</div>`;
  }
  $('#view').innerHTML=h;
}
async function ack(){
  if(MODE==='demo'){S.notices.forEach(n=>{if(n.crewId===meId)n.read='1'});saveLocal();render();return}
  if(await api('ack'))reload();
}
async function submitApply(){
  const list=[];
  for(let i=0;i<7;i++){const a=$('#ap_s'+i).value,b=$('#ap_e'+i).value;if(!a&&!b)continue;if(!a||!b||+b<=+a)return toast(`${DAYS[i]}曜：開始と終了を正しく選んでください`);
    list.push({store:+$('#ap_t'+i).value,day:i,startH:+a,endH:+b})}
  if(!list.length)return toast('希望を入力してください');
  if(MODE==='demo'){list.forEach(x=>S.shifts.push({...x,id:uid(),crewId:meId,status:'applied',wk,auto:false}));saveLocal();meTab='mine';render()}
  else{const j=await api('apply',{rows:list.map(x=>({...x,ws:wsOf(wk)}))});if(!j)return;meTab='mine';await reload()}
  toast(`${list.length}日分を申請しました。管理者の確認を待ってください`);
}

/* ===== 起動 ===== */
(function boot(){
  if(!MODE)return showSetup();
  if(MODE==='demo'){loadLocal();ROLE='admin';render();return}
  if(!AUTH)return showLogin();
  view=AUTH.role==='admin'?'shift':'me';reload();
})();

</script>
</body>
</html>
